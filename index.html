<script>

// ================= NAVEGAÇÃO =================
function mostrar(id){
document.querySelectorAll("section").forEach(sec=>sec.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

// ================= LOGIN =================
function login(){
if(prompt("Senha do professor:")=="1234"){
mostrar("admin");
carregarTudo();
}else{
alert("Senha incorreta");
}
}

// ================= DADOS =================
let conteudos = JSON.parse(localStorage.getItem("conteudos")) || [];
let questoes = JSON.parse(localStorage.getItem("questoes")) || [];

// ================= SALVAR CONTEÚDO =================
function salvarConteudo(){

let titulo = document.getElementById("tituloConteudo").value.trim();
let serie = document.getElementById("serieConteudo").value.trim();
let disciplina = document.getElementById("disciplinaConteudo").value.trim();
let file = document.getElementById("pdfConteudo").files[0];

if(!titulo || !serie || !disciplina || !file){
alert("Preencha todos os campos!");
return;
}

let reader = new FileReader();

reader.onload = function(){

conteudos.push({
titulo,
serie,
disciplina,
pdf: reader.result
});

localStorage.setItem("conteudos", JSON.stringify(conteudos));

alert("Conteúdo salvo com sucesso!");

document.getElementById("tituloConteudo").value="";
document.getElementById("serieConteudo").value="";
document.getElementById("disciplinaConteudo").value="";
document.getElementById("pdfConteudo").value="";

carregarTudo();
};

reader.readAsDataURL(file);
}

// ================= SALVAR QUESTÃO =================
function salvarQuestao(){

let pergunta = document.getElementById("pergunta").value.trim();

if(!pergunta){
alert("Digite a pergunta!");
return;
}

let nova = {
tipo: document.getElementById("tipoQuestao").value,
serie: document.getElementById("serieQuestao").value,
disciplina: document.getElementById("disciplinaQuestao").value,
pergunta: pergunta,
a: document.getElementById("a").value,
b: document.getElementById("b").value,
c: document.getElementById("c").value,
d: document.getElementById("d").value,
correta: document.getElementById("correta").value
};

questoes.push(nova);

localStorage.setItem("questoes", JSON.stringify(questoes));

alert("Questão salva com sucesso!");

// limpar campos
document.getElementById("pergunta").value="";
document.getElementById("a").value="";
document.getElementById("b").value="";
document.getElementById("c").value="";
document.getElementById("d").value="";

carregarTudo();
}

// ================= REMOVER CONTEÚDO =================
function removerConteudo(i){
if(confirm("Deseja remover este conteúdo?")){
conteudos.splice(i,1);
localStorage.setItem("conteudos", JSON.stringify(conteudos));
carregarTudo();
}
}

// ================= REMOVER QUESTÃO =================
function removerQuestao(i){
if(confirm("Deseja remover esta questão?")){
questoes.splice(i,1);
localStorage.setItem("questoes", JSON.stringify(questoes));
carregarTudo();
}
}

// ================= CORRIGIR =================
function corrigir(){

let acertos = 0;
let total = 0;

questoes.forEach((q,i)=>{

let marcada = document.querySelector(`input[name="q${i}"]:checked`);

if(marcada){
total++;
if(marcada.value == q.correta){
acertos++;
}
}

});

alert("Resultado: "+acertos+" acertos de "+total+" questões respondidas.");
}

// ================= CARREGAR =================
function carregarTudo(){

let lc = document.getElementById("listaConteudos");
let la = document.getElementById("listaAtividades");
let ls = document.getElementById("listaSimulados");
let lade = document.getElementById("listaAde");
let lsaeb = document.getElementById("listaSaeb");

let ac = document.getElementById("adminConteudos");
let aq = document.getElementById("adminQuestoes");

// limpar
if(lc) lc.innerHTML="";
if(la) la.innerHTML="";
if(ls) ls.innerHTML="";
if(lade) lade.innerHTML="";
if(lsaeb) lsaeb.innerHTML="";
if(ac) ac.innerHTML="";
if(aq) aq.innerHTML="";

// ================= CONTEÚDOS =================
conteudos.forEach((c,i)=>{

if(lc){
lc.innerHTML+=`
<div class="card">
<b>${c.titulo}</b><br>
${c.serie} - ${c.disciplina}<br>

<a href="${c.pdf}" target="_blank">📖 Ler PDF</a><br>
<a href="${c.pdf}" download>📥 Baixar PDF</a>

</div>`;
}

if(ac){
ac.innerHTML+=`
<div class="card">
${c.titulo}
<button class="small-btn" onclick="removerConteudo(${i})">Excluir</button>
</div>`;
}

});

// ================= QUESTÕES =================
questoes.forEach((q,i)=>{

let bloco = `
<div class="card">
<b>${q.pergunta}</b><br>

<label><input type="radio" name="q${i}" value="A"> A) ${q.a}</label><br>
<label><input type="radio" name="q${i}" value="B"> B) ${q.b}</label><br>
<label><input type="radio" name="q${i}" value="C"> C) ${q.c}</label><br>
<label><input type="radio" name="q${i}" value="D"> D) ${q.d}</label><br>

</div>`;

// distribuição correta
if(q.tipo=="Atividade" && la) la.innerHTML+=bloco;
if(q.tipo=="Simulado" && ls) ls.innerHTML+=bloco;
if(q.tipo=="ADE" && lade) lade.innerHTML+=bloco;
if(q.tipo=="SAEB" && lsaeb) lsaeb.innerHTML+=bloco;

// admin
if(aq){
aq.innerHTML+=`
<div class="card">
${q.pergunta} (${q.tipo})
<button class="small-btn" onclick="removerQuestao(${i})">Excluir</button>
</div>`;
}

});

// botão finalizar por tipo
if(la && la.innerHTML!="") la.innerHTML+=`<button onclick="corrigir()">Finalizar Atividade</button>`;
if(ls && ls.innerHTML!="") ls.innerHTML+=`<button onclick="corrigir()">Finalizar Simulado</button>`;
if(lade && lade.innerHTML!="") lade.innerHTML+=`<button onclick="corrigir()">Finalizar ADE</button>`;
if(lsaeb && lsaeb.innerHTML!="") lsaeb.innerHTML+=`<button onclick="corrigir()">Finalizar SAEB</button>`;

}

carregarTudo();

</script>

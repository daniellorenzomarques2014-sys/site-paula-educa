<script>

// GARANTE QUE O HTML CARREGOU
window.onload = function(){

// ===== BANCO =====
let conteudos = JSON.parse(localStorage.getItem("conteudos") || "[]");
let questoes = JSON.parse(localStorage.getItem("questoes") || "[]");

// ===== NAVEGAÇÃO =====
window.mostrar = function(id){
document.querySelectorAll("section").forEach(sec=>sec.classList.remove("active"));
let sec = document.getElementById(id);
if(sec) sec.classList.add("active");
}

// ===== LOGIN =====
window.login = function(){
if(prompt("Senha do professor:")=="1234"){
mostrar("admin");
carregarTudo();
}else{
alert("Senha incorreta");
}
}

// ===== SALVAR CONTEÚDO =====
window.salvarConteudo = function(){

let titulo = document.getElementById("tituloConteudo");
let serie = document.getElementById("serieConteudo");
let disciplina = document.getElementById("disciplinaConteudo");
let file = document.getElementById("pdfConteudo");

if(!titulo || !serie || !disciplina || !file) return;

if(!titulo.value || !serie.value || !disciplina.value || file.files.length===0){
alert("Preencha todos os campos!");
return;
}

let reader = new FileReader();

reader.onload = function(e){

conteudos.push({
titulo: titulo.value,
serie: serie.value,
disciplina: disciplina.value,
pdf: e.target.result
});

localStorage.setItem("conteudos", JSON.stringify(conteudos));

alert("Conteúdo salvo!");

carregarTudo();

};

reader.readAsDataURL(file.files[0]);

}

// ===== SALVAR QUESTÃO =====
window.salvarQuestao = function(){

let pergunta = document.getElementById("pergunta");

if(!pergunta || !pergunta.value){
alert("Digite a pergunta!");
return;
}

questoes.push({
tipo: document.getElementById("tipoQuestao").value,
serie: document.getElementById("serieQuestao").value,
disciplina: document.getElementById("disciplinaQuestao").value,
pergunta: pergunta.value,
a: document.getElementById("a").value,
b: document.getElementById("b").value,
c: document.getElementById("c").value,
d: document.getElementById("d").value,
correta: document.getElementById("correta").value
});

localStorage.setItem("questoes", JSON.stringify(questoes));

alert("Questão salva!");

carregarTudo();

}

// ===== REMOVER CONTEÚDO =====
window.removerConteudo = function(i){
conteudos.splice(i,1);
localStorage.setItem("conteudos", JSON.stringify(conteudos));
carregarTudo();
}

// ===== REMOVER QUESTÃO =====
window.removerQuestao = function(i){
questoes.splice(i,1);
localStorage.setItem("questoes", JSON.stringify(questoes));
carregarTudo();
}

// ===== CARREGAR =====
function carregarTudo(){

let lc = document.getElementById("listaConteudos");
let la = document.getElementById("listaAtividades");
let ls = document.getElementById("listaSimulados");
let lade = document.getElementById("listaAde");
let lsaeb = document.getElementById("listaSaeb");

let ac = document.getElementById("adminConteudos");
let aq = document.getElementById("adminQuestoes");

if(lc) lc.innerHTML="";
if(la) la.innerHTML="";
if(ls) ls.innerHTML="";
if(lade) lade.innerHTML="";
if(lsaeb) lsaeb.innerHTML="";
if(ac) ac.innerHTML="";
if(aq) aq.innerHTML="";

// CONTEÚDOS
conteudos.forEach((c,i)=>{

if(lc){
lc.innerHTML += `
<div class="card">
<b>${c.titulo}</b><br>
${c.serie} - ${c.disciplina}<br>
<a href="${c.pdf}" target="_blank">Abrir PDF</a><br>
<a href="${c.pdf}" download>Baixar PDF</a>
</div>`;
}

if(ac){
ac.innerHTML += `
<div class="card">
${c.titulo}
<button class="small-btn" onclick="removerConteudo(${i})">Excluir</button>
</div>`;
}

});

// QUESTÕES
questoes.forEach((q,i)=>{

let bloco = `<div class="card"><b>${q.pergunta}</b></div>`;

if(q.tipo=="Atividade" && la) la.innerHTML+=bloco;
if(q.tipo=="Simulado" && ls) ls.innerHTML+=bloco;
if(q.tipo=="ADE" && lade) lade.innerHTML+=bloco;
if(q.tipo=="SAEB" && lsaeb) lsaeb.innerHTML+=bloco;

if(aq){
aq.innerHTML += `
<div class="card">
${q.pergunta}
<button class="small-btn" onclick="removerQuestao(${i})">Excluir</button>
</div>`;
}

});

}

// INICIALIZA
carregarTudo();

};

</script>
